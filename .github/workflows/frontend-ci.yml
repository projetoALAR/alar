name: Frontend CI

on:
  push:
    paths:
      - "workspace-juridico-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "workspace-juridico-frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: workspace-juridico-frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workspace-juridico-frontend/package-lock.json

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_ALLOW_REGISTER: "false"
